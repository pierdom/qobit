[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qobit"
version = "0.1.1"
description = "Bit-perfect Qobuz TUI client"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "httpx>=0.27",
    "textual>=0.80",
    "textual-image>=0.7",
    "pillow>=10.0",
    # Qobuz Connect (connect/): cloud websocket + protobuf messages. The
    # generated *_pb2.py check the runtime at import, hence the floor.
    "protobuf>=7.36.1",
    "websockets>=14.0",
    # OS media controls (audio/media_keys.py). Required per platform rather
    # than extras: `uv sync` strips any extra not named on the command line,
    # and media_keys degrades silently, so keys just stop working.
    "pyobjc-framework-MediaPlayer>=10.0; sys_platform == 'darwin'",
    "pydbus>=0.6; sys_platform == 'linux'",
    "PyGObject>=3.50; sys_platform == 'linux'",
]

[project.scripts]
qobit = "qobit.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qobit"]

[dependency-groups]
dev = ["ruff>=0.4", "textual-dev>=0.80", "pytest>=8.0"]

[tool.ruff]
line-length = 100
# protoc output (connect/proto) and the spike's local regen dir.
extend-exclude = ["src/qobit/connect/proto", "spikes/qobuz_connect/pb"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
