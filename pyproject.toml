[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qobit"
version = "0.6.0"
description = "A bit-perfect Qobuz client with a terminal UI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Piero Fiadino" }]
keywords = ["qobuz", "hi-res", "flac", "bit-perfect", "tui", "textual", "mpv", "music-player"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "httpx>=0.28",
    "textual>=8.2",
    "textual-image>=0.12",
    "pillow>=11.0",
    # Qobuz Connect (connect/): cloud websocket + protobuf messages. The
    # generated *_pb2.py check the runtime at import, hence the floor.
    "protobuf>=7.36.1",
    "websockets>=14.0",
    # OS media controls (audio/media_keys.py). Required per platform rather
    # than extras: `uv sync` strips any extra not named on the command line,
    # and media_keys degrades silently, so keys just stop working.
    "pyobjc-framework-MediaPlayer>=10.0; sys_platform == 'darwin'",
    "pydbus>=0.6; sys_platform == 'linux'",
    "PyGObject>=3.50; sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://github.com/pierdom/qobit"
Repository = "https://github.com/pierdom/qobit"
Issues = "https://github.com/pierdom/qobit/issues"
Changelog = "https://github.com/pierdom/qobit/blob/main/CHANGELOG.md"

[project.scripts]
qobit = "qobit.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qobit"]

[dependency-groups]
dev = ["ruff>=0.4", "textual-dev>=1.7", "pytest>=8.0"]

[tool.ruff]
line-length = 100
# Generated protobuf code, and spikes/: a frozen, throwaway experiment kept as
# the record of how the Qobuz Connect protocol was worked out.
extend-exclude = ["src/qobit/connect/proto", "spikes"]

[tool.ruff.lint]
select = [
    "E", "F", "I",  # pycodestyle, pyflakes, isort
    "B",            # likely bugs
    "UP",           # modern syntax
    "SIM",          # simplifications
    "RET",          # consistent returns
    "PIE", "C4",    # small idioms
    "RUF",          # ruff-specific
]
ignore = [
    "RUF012",                      # Textual's BINDINGS/CSS class attributes are lists by design
    "RUF001", "RUF002", "RUF003",  # intentional glyphs (♥ ▶ ⏸ · —) in strings and comments
]

[tool.pytest.ini_options]
testpaths = ["tests"]
