[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qobit"
version = "0.13.0"
description = "A bit-perfect Qobuz client for the terminal (TUI), for Linux and macOS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Piero Fiadino" }]
keywords = [
    "qobuz",
    "qobuz-client",
    "qobuz-player",
    "linux",
    "terminal",
    "tui",
    "cli",
    "hi-res",
    "flac",
    "bit-perfect",
    "music-player",
    "textual",
    "mpv",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "httpx>=0.28",
    "textual>=8.2",
    "textual-image>=0.12",
    "pillow>=11.0",
    # Qobuz Connect (connect/): cloud websocket + protobuf messages. The
    # generated *_pb2.py check the runtime at import, hence the floor.
    "protobuf>=7.36.1",
    "websockets>=14.0",
    # OS media controls (audio/media_keys.py). Required per platform rather
    # than extras: `uv sync` strips any extra not named on the command line,
    # and media_keys degrades silently, so keys just stop working.
    # Linux: MPRIS2 over D-Bus with dbus-fast (pure Python, wheels; nothing
    # to compile, unlike pydbus + PyGObject).
    "pyobjc-framework-MediaPlayer>=10.0; sys_platform == 'darwin'",
    "dbus-fast>=5.0; sys_platform == 'linux'",
    # The session token in the system keyring (token_store.py): macOS
    # Keychain, Linux Secret Service. Falls back to config.json without one.
    "keyring>=25.0",
]

[project.urls]
Homepage = "https://github.com/pierdom/qobit"
Repository = "https://github.com/pierdom/qobit"
Issues = "https://github.com/pierdom/qobit/issues"
Changelog = "https://github.com/pierdom/qobit/blob/main/CHANGELOG.md"

[project.scripts]
qobit = "qobit.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qobit"]

# The sdist carries what's needed to build, test and package qobit: no
# screenshots, spikes/, CI config or contributor notes.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/contrib",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/SECURITY.md",
]
exclude = ["__pycache__"]

[dependency-groups]
dev = ["ruff>=0.4", "textual-dev>=1.7", "pytest>=8.0"]

[tool.ruff]
line-length = 100
# Generated protobuf code, and spikes/: a frozen, throwaway experiment kept as
# the record of how the Qobuz Connect protocol was worked out.
extend-exclude = ["src/qobit/connect/proto", "spikes"]

[tool.ruff.lint]
select = [
    "E", "F", "I",  # pycodestyle, pyflakes, isort
    "B",            # likely bugs
    "UP",           # modern syntax
    "SIM",          # simplifications
    "RET",          # consistent returns
    "PIE", "C4",    # small idioms
    "RUF",          # ruff-specific
]
ignore = [
    "RUF012",                      # Textual's BINDINGS/CSS class attributes are lists by design
    "RUF001", "RUF002", "RUF003",  # intentional glyphs (♥ ▶ ⏸ · —) in strings and comments
]

[tool.pytest.ini_options]
testpaths = ["tests"]
