name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only checks out and tests (nothing to push or publish).
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      # PyGObject/pycairo (Linux media keys, MPRIS) ship no wheels and compile
      # against these; without them `uv sync` fails before anything runs.
      # Same list as the README's Debian/Ubuntu line (needs GLib >= 2.80).
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config python3-dev libcairo2-dev libgirepository-2.0-dev
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config python3-dev libcairo2-dev libgirepository-2.0-dev
      - run: uv sync --group dev
      - run: uv run pytest -v
