name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Read-only token: CI only checks out and tests (nothing to push or publish).
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    # The oldest and newest supported Python on both platforms qobit claims.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      # tests/test_mpris.py talks to a private dbus-daemon; without one those
      # tests skip, so make sure it's there.
      - name: dbus-daemon
        if: runner.os == 'Linux'
        run: |
          command -v dbus-daemon || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends dbus-daemon
          }
      - run: uv sync --group dev
      - run: uv run pytest -v
